<!-- First paint waits until the hero is fully parsed (the element after it, #after-hero, exists): no half-built,
     bottom-anchored hero growing on screen. Chromium only; other browsers ignore it. -->
<link rel="expect" href="#after-hero" blocking="render" />
<script>
  (function () {
    var d = document.documentElement;
    d.classList.remove('no-js');
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) d.classList.add('reduced');
    // Opening intro lives on Home only: plays on every load and reload, skipped on internal navigation (curtain instead) and for reduced motion.
    try {
      var isHome = /^\/(index(\.html)?)?$/.test(location.pathname);
      var viaLink = !!sessionStorage.getItem('lt-transition');
      if (isHome && !reduce && !viaLink) d.classList.add('intro-active');
      else d.classList.add('no-loader');
      // arriving through an internal link: the curtain is already down at first paint, JS lifts it (one wipe, no flash)
      if (viaLink && !reduce) d.classList.add('curtain-in');
    } catch (e) { d.classList.add('no-loader'); }
    // Safety net: if the app script fails to start, never leave content hidden.
    setTimeout(function () { if (!window.__ltBooted) { d.classList.add('reduced', 'no-loader', 'lt-fallback'); d.classList.remove('intro-active'); } }, 6000);
  })();
</script>
