<script>
  document.documentElement.classList.remove('no-js');
  // Opening intro: every fresh visit to Home; other pages only on the first page of a visit; never on internal navigation.
  try {
    var isHome = /^\/(index\.html)?$/.test(location.pathname);
    var reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion || sessionStorage.getItem('lt-transition') || (!isHome && sessionStorage.getItem('lt-visited'))) document.documentElement.classList.add('no-loader');
    else document.documentElement.classList.add('intro-active');
  } catch (e) {}
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('reduced');
  // Safety net: if the app script fails to start, never leave content hidden behind the loader/reveals.
  setTimeout(function () { if (!window.__ltBooted) { document.documentElement.classList.add('reduced', 'no-loader', 'lt-fallback'); document.documentElement.classList.remove('intro-active'); } }, 5000);
</script>
