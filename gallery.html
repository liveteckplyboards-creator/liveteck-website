<!doctype html>
<html lang="en-IN" class="no-js">
<head>
  <!-- @include head.html path="/gallery" title="Gallery: Interiors Made with Liveteck | Liveteck Ply &amp; Boards, Kakinada" desc="Photos of kitchens, wardrobes, doors, living rooms and offices built with Liveteck plywood, block boards, laminates and veneers. See the finish, then visit our Kakinada store." lcp="spaces/kitchen" -->
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"{{site}}/"},{"@type":"ListItem","position":2,"name":"Gallery","item":"{{site}}/gallery"}]}</script>
</head>
<body data-page="gallery">
  <!-- @include header.html -->

  <main id="main">
    <section class="page-hero grain">
      <div class="ph-media"><!-- @include hero-img.html id="spaces/kitchen" --></div>
      <div class="container on-dark">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a><span aria-hidden="true">/</span><span>Gallery</span></nav>
        <div class="ph-grid">
          <h1 class="h1" data-split>Spaces built<br>with <em>Liveteck</em>.</h1>
          <div class="reveal">
            <p class="lead">Kitchens, wardrobes, doors and interiors made with our plywood, boards, laminates and veneers. Tap any photo to see it full size.</p>
          </div>
        </div>
      </div>
    </section>

    <section class="section bg-ivory" id="after-hero" aria-labelledby="gal-title">
      <div class="container">
        <h2 class="sr-only" id="gal-title">Photo gallery</h2>
        <div class="gal-tools" data-gal-tools></div>
        <div class="gal-grid" data-gal-grid aria-live="polite">
          <!-- placeholders until the photos load (same size, so nothing jumps) -->
          <span class="gal-ghost"></span><span class="gal-ghost"></span><span class="gal-ghost"></span>
          <span class="gal-ghost"></span><span class="gal-ghost"></span><span class="gal-ghost"></span>
        </div>
      </div>
    </section>

    <section class="section cta-banner grain cv" aria-labelledby="cta-title">
      <div class="cb-bg"><img data-parallax="16" src="https://res.cloudinary.com/duswrz4u/image/upload/f_auto,q_auto,w_1920,c_limit/liveteck/brand/veneer-texture" srcset="https://res.cloudinary.com/duswrz4u/image/upload/f_auto,q_auto,w_640,c_limit/liveteck/brand/veneer-texture 640w, https://res.cloudinary.com/duswrz4u/image/upload/f_auto,q_auto,w_1280,c_limit/liveteck/brand/veneer-texture 1280w, https://res.cloudinary.com/duswrz4u/image/upload/f_auto,q_auto,w_1920,c_limit/liveteck/brand/veneer-texture 1920w" sizes="100vw" alt="" loading="lazy" /></div>
      <div class="container on-dark">
        <div>
          <span class="eyebrow reveal">See it in person</span>
          <h2 class="display" id="cta-title" data-split style="margin-top:22px">Like what<br>you <em>see</em>?</h2>
        </div>
        <div class="actions reveal">
          <a class="btn btn--gold" href="tel:+919912153030" data-href="tel" data-magnetic>Call now</a>
          <a class="btn btn--wa" href="https://wa.me/919912153030" data-href="wa" target="_blank" rel="noopener" data-magnetic>WhatsApp</a>
        </div>
      </div>
    </section>
  </main>

  <div class="gal-lb" data-gal-lb role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <div class="gal-lb-track" data-lb-track tabindex="-1"></div>
    <div class="gal-lb-bar">
      <span class="gal-lb-count" data-lb-count aria-live="polite"></span>
      <button class="gal-lb-btn" type="button" data-lb-close aria-label="Close photo viewer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <button class="gal-lb-btn gal-lb-prev" type="button" data-lb-step="-1" aria-label="Previous photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="gal-lb-btn gal-lb-next" type="button" data-lb-step="1" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>

  <!-- @include footer.html -->
  <script type="module" src="/src/js/pages/gallery.js"></script>
</body>
</html>
